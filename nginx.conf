server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA + kiosk: keep responses lean and cache long-lived hashed assets.
    #
    # `npm run build` writes .br and .gz siblings next to every text asset
    # (scripts/precompress-dist.mjs), so the compressed payload is served straight
    # from disk instead of being rebuilt per request. brotli_static needs
    # ngx_brotli; when the module is absent nginx ignores the directive and
    # gzip_static still covers every client the kiosk sees.
    brotli_static on;
    gzip_static on;

    # Fallback for anything that has no precompressed sibling.
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security / privacy headers suitable for a closed kiosk.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the only unhashed entry point, so it must never be pinned:
    # a stale copy would keep pointing at asset URLs from a previous build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media is range-requested by <video>/<audio>; keep byte ranges enabled and
    # do not let gzip touch it (it is already compressed and ranges would break).
    location ~* \.(webm|mp4|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges bytes;
        gzip off;
        try_files $uri =404;
    }

    # Avoid logging every static asset hit on the kiosk.
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
