    <!--
      Fonts are loaded without blocking the first paint: `media="print"` keeps
      the stylesheet out of the render-blocking set, and the onload swap applies
      it the moment it arrives. Every family here has a system fallback in
      index.css, so a kiosk that is offline draws immediately in the fallback
      instead of holding a blank screen until the request times out.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Oxygen:wght@300;400;700&display=swap"
    />
    <noscript>
